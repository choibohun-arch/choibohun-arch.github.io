<!doctype html><meta charset="utf-8"><title>OAuth callback</title>
<h3>Tesla 인증 코드 / Authorization code</h3>
<p>아래 코드를 복사해 어시스턴트에게 전달하세요 (몇 분 내 만료). Copy this code (expires within minutes):</p>
<pre id="c" style="font-size:1.1em;word-break:break-all"></pre><p id="s"></p>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('c').textContent=p.get('code')||('ERROR: '+(p.get('error')||'no code')+' '+(p.get('error_description')||''));
document.getElementById('s').textContent='state='+(p.get('state')||'');
</script>
